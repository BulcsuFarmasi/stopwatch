name: stopwatch
description: "A Stopwatch app."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.13.0

dependencies:
  flutter:
    sdk: flutter

  flutter_riverpod: ^3.4.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  fake_async: ^1.3.3


flutter:
  uses-material-design: true
  fonts:
     - family: RobotoCondensed
       fonts:
         - asset: assets/fonts/roboto_condensed/RobotoCondensed-Medium.ttf
           weight: 500
         - asset: assets/fonts/roboto_condensed/RobotoCondensed-Light.ttf
           weight: 300
