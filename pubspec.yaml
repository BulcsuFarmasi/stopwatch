name: stopwatch
description: "A Stopwatch app."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.13.0

dependencies:
  flutter:
    sdk: flutter

  flutter_riverpod: ^3.4.2
  shared_preferences: ^2.5.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  fake_async: ^1.3.3
  mocktail: ^1.0.5
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.8


flutter:
  uses-material-design: true
  fonts:
     - family: RobotoCondensed
       fonts:
         - asset: assets/fonts/roboto_condensed/RobotoCondensed-Medium.ttf
           weight: 500
         - asset: assets/fonts/roboto_condensed/RobotoCondensed-Light.ttf
           weight: 300
